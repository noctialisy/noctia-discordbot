---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noctia-discordbot
  labels:
    app: noctia-discordbot

spec:
  replicas: 1
  selector:
    matchLabels:
      app: noctia-discordbot
  template:
    metadata:
      labels:
        app: noctia-discordbot
    spec:
      volumes:
      - name: noctia-discordbot-source
        hostPath:
          path: ${k8s.deploy.path}

      containers:
      - name: python
        image: "${k8s.container.image}"
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - name: noctia-discordbot-source
            mountPath: /usr/src/app/
        env:
          - name: PYTHONUNBUFFERED
            value: "1"

        resources:
          limits:
            cpu: 500m
            memory: 512M

      imagePullSecrets:
        - name: ${k8s.container.image.secret}
